<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root {
      --primary: #1924a1;
      --primary-dark: #080f56;
      --light-bg: #e6f7f9;
      --white: #ffffff;
      --text: #05030c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--light-bg);
      color: var(--text);
    }

    .topbar {
      background: var(--primary-dark);
      display: flex;
      align-items: center;
      padding: 8px 20px;
    }

    .topbar img {
      width: 60px;
      height: 52px;
      margin-right: 12px;
    }

    .topbar h2 {
      color: var(--white);
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .wrapper {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    .sidebar {
      width: 200px;
      background: var(--primary);
      padding: 20px 0;
      color: #ffffff;
    }

    .sidebar a {
      display: block;
      color: var(--white);
      text-decoration: none;
      padding: 12px 24px;
      font-size: 15px;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .main {
      flex: 1;
      padding: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
  label,select{
    display: block;
    margin-top: 5px;
  }
    
    </style>
<body>

    <h2>AUREVIA UNIVERSITY</h2>
  </div>

      <a href="timetable.html">Time-Table</a><hr />
      <a href="feedback.html">Feedback</a><hr />
      <a href="conversate.html">Conversate</a><hr>
      <a href="logout.html">Logout</a><hr />
    </nav>

</body>
</html>

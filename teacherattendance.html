<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance | ERP</title>

    <style>
        /* ---------- ORIGINAL CSS (unchanged) ---------- */
        :root {
            --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
        body { background: var(--light-bg); }
        .topbar {
            background: var(--primary-dark); padding: 8px 20px;
            display: flex; align-items: center;
        }
        .topbar img { width: 60px; height: 52px; margin-right: 12px; }
        .topbar h2 { color: var(--white); }
        .wrapper { display: flex; min-height: calc(100vh - 68px); }
        .sidebar {
            width: 200px; background: var(--primary); padding: 20px 0;
        }
        .sidebar a {
            display: block; padding: 12px 24px; color: white;
            text-decoration: none;
        }
        .sidebar a:hover { background: rgba(0,0,0,0.15); }
        .main { flex: 1; padding: 30px; }

        /* ---------- ADDED FOR VIEW ATTENDANCE ---------- */
        .attendance-box {
            background: white; padding: 20px;
            border-radius: 10px; max-width: 650px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .percentage {
            font-size: 30px;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }
        table {
            width: 100%; background: #f3f3f3;
            margin-top: 10px; border-radius: 6px;
        }
        table th, table td {
            padding: 10px; text-align: center;
            border-bottom: 1px solid #ddd;
        }
           .logo-navbar{
             display: flex;
           text-align: left;
           background-color: #001a4d;
           color:#eaf4ff;
           height:80px;
        }
    </style>
</head>

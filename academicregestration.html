<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Registration | AUREVIA University</title>
  <style>
    :root {
      --primary: #1924a1;
      --primary-dark: #080f56;
      --light-bg: #e6f7f9;
      --white: #ffffff;
      --text: #05030c;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background: var(--light-bg);
      color: var(--text);
    }
    .topbar {
      background: var(--primary-dark);
      display: flex;
      align-items: center;
      padding: 8px 20px;
    }
    .topbar img {
      width: 60px;
      height: 52px;
      margin-right: 12px;
      border-radius: 6px;
    }
    .topbar h2 {
      color: var(--white);
      font-weight: 400;
      letter-spacing: 1px;
    }
    .wrapper {
      display: flex;
      min-height: calc(100vh - 68px);
    }
    .sidebar {
      width: 220px;
      background: var(--primary);
      padding: 20px 0;
      color: #ffffff;
      flex-shrink: 0;
    }
    .sidebar a {
      display: block;
      color: var(--white);
      text-decoration: none;
      padding: 12px 24px;
      font-size: 15px;
      transition: 0.2s;
    }
    .sidebar a:hover {
      background: rgba(0, 0, 0, 0.15);
    }
    .main {
      flex: 1;
      padding: 30px;
    }
    .main h3 {
      font-size: 26px;
      margin-bottom: 30px;
      color: var(--primary-dark);
      border-bottom: 2px solid var(--primary);
      display: inline-block;
      padding-bottom: 5px;
    }
    .reg-table {
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      padding: 20px;
      width: 100%;
      max-width: 800px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 10px;
      text-align: left;
    }
    th {
      background: var(--primary);
      color: var(--white);
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    tr:nth-child(even) {
      background-color: #f1f1f1;
    }
    select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 14px;
      background-color: #fff;
    }
    .submit-btn {
      margin-top: 25px;
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="AUREVIE LOGO.png" alt="KL Logo" />
    <h2>AUREVIA UNIVERSITY</h2>
  </div>
  <div class="wrapper">
    <nav class="sidebar">
      <a href="profile.html">Profile</a><hr>

      <a href="timetable.html">Time-Table</a><hr>
      <a href="feedback.html">Feedback</a><hr>
      <a href="conversate.html">Conversate</a><hr>
      <a href="logout.html">Logout</a><hr>
    </nav>

</body>
</html>

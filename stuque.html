<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
:root {
      --primary: #1924a1;
      --primary-dark: #080f56;
      --light-bg: #e6f7f9;
      --white: #ffffff;
      --text: #05030c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--light-bg);
      color: var(--text);
    }

    .topbar {
      background: var(--primary-dark);
      display: flex;
      align-items: center;
      padding: 8px 20px;
    }

    .topbar img {
      width: 60px;
      height: 52px;
      margin-right: 12px;
    }

    .topbar h2 {
      color: var(--white);
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .wrapper {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    .sidebar {
      width: 200px;
      background: var(--primary);
      padding: 20px 0;
      color: #ffffff;
    }

    .sidebar a {
      display: block;
      color: var(--white);
      text-decoration: none;
      padding: 12px 24px;
      font-size: 15px;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background: rgba(0, 0, 0, 0.1);
    }
    input{
      padding: 8px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
   .main {
      flex: 1;
      display: flex;
      align-items: center;   
      justify-content: center;
   }

    select, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #30254d;
  font-size: 14px;
  margin-bottom: 20px;
}

textarea {
  resize: none;
  height:150px;
  width: 580px;
  border-radius: 12px;
  box-shadow: 3px;
  border-color: bold rgb(56, 56, 132);
}
h1{
    text-align: center;
    color: #080f56;
}
.content {
  display: flex;
  flex-direction: column;
  align-items: center;        /* Centers horizontally */
  justify-content: center;    /* Centers vertically within .main */
  text-align: center;
  background: white;
  padding: 30px 40px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}
button{
    width: 10%;
      padding: 8px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 33rem;
      color: white;
      background-color: #323b9d;
}
button:hover{
   background-color: #080f56; 
}

</style>
<body>
     <div class="topbar">
    <img src="AUREVIE LOGO.png" alt="KL Logo" />
    <h2>AUREVIA UNIVERSITY</h2>
  </div>

  <div class="wrapper">
    <nav class="sidebar">
      <a href="profile.html">Profile</a><hr />
      <a href="academicregestration.html">Academic Registration</a><hr />
      <a href="attendance.html">Attendance</a><hr />
      <a href="courses.html">Courses</a><hr />
      <a href="feepayments.html">Fee Payments</a><hr />
       <a href="stuque.html">Conversate</a><hr>
      <a href="results.html">Results</a><hr />
      <a href="timetable.html">Time-Table</a><hr />
      <a href="feedback.html">Feedback</a><hr />
      <a href="logout.html">Logout</a><hr />
    </nav>
    <main class="main">
        <div class="content">
            <h2>Query Box:</h2>
       <textarea placeholder="Ask you queries here.."></textarea>
       <button>Send</button>
       </div>
    </main>
</body>
</html>

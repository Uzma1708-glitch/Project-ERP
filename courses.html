    <style>
            :root {
          --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: var(--light-bg);
            color: var(--text);
        }
        .topbar {
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            padding: 8px 20px;
        }
        .topbar img {
            width: 60px;
            height: 52px;
            margin-right: 12px;
        }
        .topbar h2 {
            color: var(--white);
            font-weight: 400;
            letter-spacing: 1px;
        }
        .wrapper {
            display: flex;
            min-height: calc(100vh - 68px);
        }
        .sidebar {
            width: 200px;
            background: var(--primary);
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            color: var(--white);
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            transition: .2s;
        }
        .sidebar a:hover {
            background: rgba(0, 0, 0, .1);
        }
        .main {
            flex: 1;
            padding: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }
        th, td {
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #cdecee;
        }
        th {
            background: var(--primary-dark);
            color: var(--white);
        }
        td {
            background: #f5fdff;
        }
        tr:nth-child(even) td {
            background: #e6f7f9;
        }
        .break {
            background: #1f66d1 !important;
            font-weight: bold;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Monitor | Admin Panel</title>

    <style>
        :root {
            --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--light-bg);
            color: var(--text);
        }

        .topbar {
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            padding: 10px 20px;
        }

        .topbar img {
            width: 60px;
            height: 52px;
            margin-right: 12px;
        }

        .topbar h2 {
            color: var(--white);
            font-weight: 400;
        }

        .wrapper {
            display: flex;
            min-height: calc(100vh - 68px);
        }

        .sidebar {
            width: 200px;
            background: var(--primary);
            padding: 20px 0;
            color: white;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            font-size: 15px;
        }

        .sidebar a:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        .main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        .desc {
            color: #555;
            margin-bottom: 25px;
        }

        .box {
            background: white;
            padding: 20px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary-dark);
            margin-bottom: 25px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 15px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            background: var(--primary-dark);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--primary);
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background: var(--primary-dark);
            color: white;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <img src="AUREVIE LOGO.png">
        <h2>AUREVIA UNIVERSITY</h2>
    </div>

    <div class="wrapper">
        <nav class="sidebar">
            <a href="adminstratordash.html">Dashboard</a><hr>
            <a href="erpsettings.html">ERP Settings</a><hr>
            <a href="userroles.html">User Roles</a><hr>
            <a href="attendancemonitor.html">Attendance Monitor</a><hr>
            <a href="resourcemanage.html">Resource Management</a><hr>
            <a href="reports.html">Reports</a><hr>
            <a href="communication.html">Communications</a><hr>
            <a href="logout.html">Logout</a><hr>
        </nav>

        <main class="main">

            <div class="header-title">Attendance Monitor</div>
            <div class="desc">Select a role to view real-time attendance logs.</div>

            <!-- Selection Box -->
            <div class="box">
                <label><b>Select Role</b></label>
                <select id="roleSelect" onchange="showLogs()">
                    <option value="">-- Choose --</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <div class="box" id="logBox" style="display:none;">
                <h3>Attendance Logs</h3>

                <table id="logsTable"></table>
            </div>

        </main>
    </div>
    <script>
        function showLogs() {
            let role = document.getElementById("roleSelect").value;
            let logBox = document.getElementById("logBox");
            let table = document.getElementById("logsTable");

            if (role === "") {
                logBox.style.display = "none";
                return;
            }

            logBox.style.display = "block";

            if (role === "teacher") {
                table.innerHTML = `
                    <tr><th>Teacher</th><th>Date</th><th>Status</th></tr>
                    <tr><td>Mr. Sharma</td><td>08 Nov 2025</td><td>Present</td></tr>
                    <tr><td>Mrs. Iyer</td><td>08 Nov 2025</td><td>On Leave</td></tr>
                    <tr><td>Dr. Patel</td><td>08 Nov 2025</td><td>Present</td></tr>
                `;
            }

            if (role === "student") {
                table.innerHTML = `
                    <tr><th>Student</th><th>Date</th><th>Status</th></tr>
                    <tr><td>Rahul Kumar</td><td>08 Nov 2025</td><td>Present</td></tr>
                    <tr><td>Ananya R</td><td>08 Nov 2025</td><td>Present</td></tr>
                    <tr><td>Neha Singh</td><td>08 Nov 2025</td><td>Absent</td></tr>
                `;
            }
        }
    </script>

</body>
</html>

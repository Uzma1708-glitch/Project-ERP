<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | KL ERP</title>
    <style>
        :root {
          --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .button{
        border-radius: 12px;
        padding: 40px;
        width: 250px;
        height: 190px;
        font-size: x-large;
        font-weight: 600;
        color: rgb(55, 55, 109);
        transition: 0.3s;
        box-shadow: 10px;
       box-shadow: 0 4px 8px rgba(0,0,0,0.2),
            0 6px 20px rgba(0,0,0,0.19);
     }
        body {
            background: var(--light-bg);
            color: var(--text);
        }
        .topbar {
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            padding: 8px 20px;
        }
        .topbar img {
            width: 60px;
            height: 52px;
            margin-right: 12px;
        }
        .topbar h2 {
            color: var(--white);
            font-weight: 400;
            letter-spacing: 1px;
        }
        .wrapper {
            display: flex;
            min-height: calc(100vh - 68px);
        }
        .sidebar {
            width: 200px;
            background: var(--primary);
            padding: 20px 0;
            color: #ffffff;
        }
        .sidebar a {
            display: block;
            color: var(--white);
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            transition: .2s;
        }
        .sidebar a:hover {
            background: rgba(0, 0, 0, .1);
        }
        .main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            margin-top: 20px;
        }
        .card {
            background: var(--white);
            border-radius: 6px;
            padding: 22px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
            border-left: 5px solid var(--primary-dark);
        }
        .card h4 {
            margin-bottom: 8px;
            color: var(--primary-dark);
        }
        .card p {
            font-size: 26px;
            font-weight: bold;
            color: var(--text);
        }
        .footer-note {
            margin-top: 40px;
            font-size: 13px;
            color: #888;
        }
        .role_button {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }
        .role_button button {
            border: none;
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            width: 230px;
            height: 190px;
            font-size: large;
            font-weight: 600;
            color: rgb(55, 55, 109);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2),
                        0 6px 20px rgba(0,0,0,0.19);
            cursor: pointer;
        }
        .role_button img {
            display: block;
            width: 100px;
            height: 100px;
            margin: 10px auto 0;
            border-radius: 50%;
        }
        .grade-card {
    margin-top: 20px;
}

.grade-card select {
    width: 100%;
    padding: 10px;
    border-radius: 7px;
    border: 1px solid #888;
    margin-bottom: 18px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
}

th {
    background: #1924a1;
    color: white;
}

tr:nth-child(even) {
    background: #f5f5f5;
}

.mark-input {
    width: 70px;
    padding: 5px;
    border-radius: 6px;
    border: 1px solid #777;
}

.submit-btn {
    background: #080f56;
    color: white;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.submit-btn:hover {
    background: #1924a1;
}
</style>

<script>
function showAssignmentTable() {
    document.getElementById("grade-table").style.display = "block";
}
</script>
</head>
<body>
    <div class="topbar">
        <img src="AUREVIE LOGO.png" alt="KL Logo">
        <h2>AUREVIA UNIVERSITY</h2>&nbsp;·&nbsp;
    </div>
    <div class="wrapper">
        <nav class="sidebar">
            <a href="teachprof.html">Profile</a><hr>

            <a href="scheduleclasses.html">schedule classes</a><hr>
            <a href="conversate.html">conversate</a><hr>
            <a href="logout.html">Logout</a><hr>
        </nav>
         <div class="content">
        <div class="card grade-card">
            <label>Select Class:</label>
            <select onchange="showAssignmentTable()">
                <option value="">-- Choose Class --</option>
                <option>CSE - A</option>
                <option>CSE - B</option>
                <option>CSE - C</option>
            </select>
            <label>Select Assignment:</label>
            <select onchange="showAssignmentTable()">
                <option value="">-- Choose Assignment --</option>
                <option>Assignment 1 - OOPS</option>
                <option>Assignment 2 - DBMS</option>
                <option>Assignment 3 - DSA</option>
            </select>
            <table id="grade-table" style="display:none;">
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>

                </tr>
                <tr>

                </tr>

                    <td>220003</td>

                    <td><input type="number" class="mark-input" min="0" max="100"></td>
                    <td><button class="submit-btn">Submit</button></td>
                </tr>
                <tr>
                    <td>220004</td>
                    <td>Megha Patel</td>
                    <td><input type="number" class="mark-input" min="0" max="100"></td>
                    <td><button class="submit-btn">Submit</button></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Attendance | Teacher ERP</title>

    <style>
        :root {
            --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body { background: var(--light-bg); color: var(--text); }

        .topbar {
            background: var(--primary-dark);
            display: flex; align-items: center;
            padding: 8px 20px;
        }
        .topbar img { width: 60px; height: 52px; margin-right: 12px; }
        .topbar h2 { color: var(--white); font-weight: 400; }

        .wrapper { display: flex; min-height: calc(100vh - 68px); }

        .sidebar {
            width: 200px;
            background: var(--primary);
            padding: 20px 0;
            color: #ffffff;
        }
        .sidebar a {
            display: block;
            color: var(--white);
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
        }
        .sidebar a:hover { background: rgba(0,0,0,0.1); }

        .main { flex: 1; padding: 30px; }

        table {
            width: 100%;
            background: #f5f5f5;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }
        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        table th {
            background: var(--primary);
            color: white;
        }

        .submit-btn {
            background: var(--primary-dark);
            color: white;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            border: none;
        }
    </style>
</head>
<body>

<div class="topbar">
    <img src="AUREVIE LOGO.png">
    <h2>AUREVIA UNIVERSITY</h2>
</div>

<div class="wrapper">
    <nav class="sidebar">
        <a href="teachprof.html">Profile</a><hr>
        <a href="sturecords.html">student records</a><hr>
        <a href="teacherattendance.html">Attendance</a><hr>
        <a href="postingattendance.html">post attendance</a><hr>
        <a href="grading.html">grade assignments</a><hr>
        <a href="scheduleclasses.html">schedule classes</a><hr>
        <a href="conversate.html">conversate</a><hr>
        <a href="logout.html">Logout</a><hr>
    </nav>

    <div class="main">
        <h2>Post Attendance</h2>

        <table class="att-table">
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Attendance</th>
            </tr>

            <tr>
                <td>001</td>
                <td>Ananya</td>
                <td>
                    <input type="radio" name="s1"> Present
                    <input type="radio" name="s1"> Absent
                </td>
            </tr>

            <tr>
                <td>002</td>
                <td>Uzma</td>
                <td>
                    <input type="radio" name="s2"> Present
                    <input type="radio" name="s2"> Absent
                </td>
            </tr>

            <tr>
                <td>003</td>
                <td>Sai</td>
                <td>
                    <input type="radio" name="s3"> Present
                    <input type="radio" name="s3"> Absent
                </td>
            </tr>
        </table>

        <button class="submit-btn">Submit Attendance</button>
    </div>
</div>

</body>
</html>

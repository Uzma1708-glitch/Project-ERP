<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | KL ERP</title>
    <style>
        :root {
         --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }
         *{
           margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: var(--light-bg);
            color: var(--text);
        }
        .topbar {
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            padding: 8px 20px;
        }
        .topbar img {
            width: 60px;
            height: 52px;
            margin-right: 12px;
        }
        .topbar h2 {
            color: var(--white);
            font-weight: 400;
            letter-spacing: 1px;
        }
        .wrapper {
            display: flex;
            min-height: calc(100vh - 68px);
        }
        .sidebar {
            width: 200px;
            background: var(--primary);
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            color: var(--white);
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            transition: .2s;
        }
        .sidebar a:hover {
            background: rgba(0, 0, 0, .1);
        }
        .main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .circle-box {
            position: relative;
            width: 200px;
            height: 200px;
        }
        .svg {
            transform: rotate(-90deg);
        }
        .bg, .progress {
            fill: none;
            stroke-width: 14;
        }
        .bg {
            stroke: #cdecee;
        }
        .progress {
            stroke: var(--primary-dark);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s;
        }
        .percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
        }
        .stats {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            text-align: center;
        }
        .stat h4 {
            color: var(--primary-dark);
            margin-bottom: 6px;
        }
        .stat p {
            font-size: 26px;
            font-weight: bold;
        }
        .absent {
            color: var(--absent);
        }
    </style>
</head>
<body>
    <div class="topbar">
        <img src="AUREVIE LOGO.png" alt="KL Logo">
        <h2>AUREVIA UNIVERSITY &nbsp;·&nbsp; Student ERP</h2>
    </div>
    <div class="wrapper">
        <nav class="sidebar">
           <a href="profile.html">Profile</a><hr>
            <a href="academicregestration.html">academic regestration</a><hr>
            <a href="attendance.html">Attendance</a><hr>
            <a href="courses.html">courses</a><hr>
        <a href="feepayments.html">fee payments</a><hr>
            <a href="results.html">Results</a><hr>
            <a href="timetable.html">Time-Table</a><hr>
            <a href="feedback.html">Feedback</a><hr>
            <a href="conversate.html">conversate</a><hr>
            <a href="logout.html">Logout</a><hr>
        </nav>
        <main class="main">
            <h3 style="margin-bottom: 30px;">My Attendance</h3>
            <div class="circle-box">
                <svg width="200" height="200">
                    <circle class="bg" cx="100" cy="100" r="86"></circle>
                    <circle class="progress" id="progress" cx="100" cy="100" r="86"></circle>
                </svg>
                <div class="percent" id="percent">0%</div>
            </div>
            <div class="stats">
                <div class="stat">
                    <h4>Present</h4>
                    <p id="present">0</p>
                </div>
                <div class="stat">
                    <h4>Absent</h4>
                    <p class="absent" id="absent">0</p>
                </div>
            </div>
        </main>
    </div>
    <script>
        const present = 46;
        const absent  = 7;
        const total   = present + absent;
        const percent = Math.round((present / total) * 100);
        const circle = document.getElementById('progress');
        const radius = 86;
        const circumference = 2 * Math.PI * radius;
        circle.style.strokeDasharray  = circumference;
        circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
        document.getElementById('percent').textContent = percent + '%';
        document.getElementById('present').textContent = present;
        document.getElementById('absent').textContent  = absent;
    </script>
</body>
</html>

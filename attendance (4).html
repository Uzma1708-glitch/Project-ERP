<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | KL ERP</title>
    <style>
        :root {
            --primary: #1924a1;
            --primary-dark: #080f56;
            --light-bg: #e6f7f9;
            --white: #ffffff;
            --text: #05030c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--light-bg);
            color: var(--text);
        }

        .topbar {
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            padding: 8px 20px;
        }

        .topbar img {
            width: 60px;
            height: 52px;
            margin-right: 12px;
        }

        .topbar h2 {
            color: var(--white);
            font-weight: 400;
            letter-spacing: 1px;
        }

        .wrapper {
            display: flex;
            min-height: calc(100vh - 68px);
        }

        .sidebar {
            width: 200px;
            background: var(--primary);
            padding: 20px 0;
        }

        .sidebar a {
            display: block;
            color: var(--white);
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            transition: .2s;
        }

        .sidebar a:hover {
            background: rgba(0, 0, 0, .1);
        }

        .main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .circle-box {
            position: relative;
            width: 200px;
            height: 200px;
        }

        svg {
            transform: rotate(-90deg);
        }

        .bg, .progress {
            fill: none;
            stroke-width: 14;
        }

        .bg {
            stroke: #cdecee;
        }

        .progress {
            stroke: var(--primary-dark);
            stroke-linecap: round;
            stroke-dasharray: 540;    /* 2πr = 2*3.14*86 */
            stroke-dashoffset: calc(540 - (540 * 86 / 100)); 
            /* 86% attendance */
        }

        .percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
        }

        .stats {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            text-align: center;
        }

        .stat h4 {
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .stat p {
            font-size: 26px;
            font-weight: bold;
        }

        .absent {
            color: red;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <img src="WhatsApp Image 2025-11-06 at 18.11.27_e7a0fa72.jpg">
        <h2>AUREVIA UNIVERSITY &nbsp;·&nbsp; Student ERP</h2>
    </div>

    <div class="wrapper">
        <nav class="sidebar">
            <a href="profile.html">Profile</a><hr>
            <a href="academicregestration.html">Academic Registration</a><hr>
            <a href="attendance.html">Attendance</a><hr>
            <a href="courses.html">Courses</a><hr>
            <a href="feepayments.html">Fee Payments</a><hr>
            <a href="stuque.html">Conversate</a>
            <a href="assignmentsubmit.html">Submit Assignments</a><hr>
            <a href="results.html">Results</a><hr>
            <a href="timetable.html">Time-Table</a><hr>
            <a href="feedback.html">Feedback</a><hr>
            <a href="logout.html">Logout</a><hr>
        </nav>

        <main class="main">
            <h3 style="margin-bottom: 30px;">My Attendance</h3>

            <div class="circle-box">
                <svg width="200" height="200">
                    <circle class="bg" cx="100" cy="100" r="86"></circle>
                    <circle class="progress" cx="100" cy="100" r="86"></circle>
                </svg>
                <div class="percent">86%</div>
            </div>

            <div class="stats">
                <div class="stat">
                    <h4>Present</h4>
                    <p>46</p>
                </div>
                <div class="stat">
                    <h4>Absent</h4>
                    <p class="absent">7</p>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
